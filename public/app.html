<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAAK – Espace élèves et tuteurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#123f3a;--green:#176b5d;--coral:#c45c43;--gold:#d9a441;--sand:#f7f4ee;--muted:#62736d;--white:#fff;--lilac:#eee8f5;--mint:#e2efe9;--peach:#fff0dc;--pink:#f8e4df;--bg:var(--sand);--card:var(--white);--mut:var(--muted);--pri:var(--green);--onpri:var(--white);--sun:var(--gold);--line:#e6e1d7;--ok:#176b5d;--no:#c45c43;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--ink:#e6eee8;--green:#4caa92;--coral:#e18a70;--gold:#e6bb65;--sand:#17231f;--muted:#b1c2b9;--white:#22332d;--lilac:#3a3343;--mint:#2a4038;--peach:#493b2d;--pink:#48332f;--bg:var(--sand);--card:var(--white);--mut:var(--muted);--pri:var(--green);--onpri:#10251f;--sun:var(--gold);--line:#3a4b43;--ok:#75c8a9;--no:#ee9b83}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 4% 38%,rgba(223,239,230,.85),transparent 30rem),radial-gradient(ellipse at 96% 72%,rgba(248,228,223,.8),transparent 34rem),var(--sand);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{width:min(1160px,calc(100% - 40px));min-height:100vh;margin:0 auto;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-block:14px 22px;padding:10px 14px;border:1px solid rgba(18,63,58,.08);border-radius:20px;background:rgba(255,255,255,.78);box-shadow:0 8px 28px rgba(18,63,58,.06);backdrop-filter:blur(14px)}
.brand{color:var(--ink);font-size:30px;font-weight:900;letter-spacing:-2px;text-decoration:none}
.brand span{color:var(--coral)}
.primary-nav{display:flex;align-items:center;gap:clamp(16px,3vw,34px)}
.nav-link{color:var(--muted);font-weight:700;text-decoration:none}
.nav-link:hover{color:var(--green)}
.language-switch{display:inline-flex;flex:none;gap:3px;padding:4px;border:1px solid #e8e4da;border-radius:999px;background:#f3f0e9}
.language-switch button{min-height:34px;border:0;border-radius:999px;padding:5px 10px;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;font-weight:800}
.language-switch button[aria-pressed="true"]{background:var(--ink);color:var(--white);box-shadow:0 3px 8px rgba(18,63,58,.2)}
main{padding:10px 0 48px}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:clamp(32px,5vw,52px);font-weight:800}h2{font-size:clamp(26px,4vw,36px);font-weight:800}h3{font-size:20px;font-weight:700}
.mut{color:var(--muted)}.sm{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{display:inline-flex;min-height:50px;align-items:center;justify-content:center;gap:9px;background:var(--green);color:var(--white);border:0;border-radius:14px;padding:11px 20px;font-weight:800;text-decoration:none;transition:transform .18s ease,background .18s ease}
.btn:hover{transform:translateY(-2px);background:var(--coral)}
.btn.alt{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn.alt:hover{background:var(--green);color:var(--white)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn.no{background:transparent;color:var(--coral);border:1px solid var(--coral)}
.card{border:1px solid rgba(18,63,58,.08);border-radius:22px;padding:24px;margin-bottom:16px;background:var(--mint);box-shadow:0 10px 26px rgba(18,63,58,.06);transition:transform .18s ease,box-shadow .18s ease}
.card:nth-child(3n+2){background:var(--peach)}
.card:nth-child(3n){background:var(--lilac)}
.card:hover{box-shadow:0 16px 34px rgba(18,63,58,.12)}
.row{display:flex;gap:12px;align-items:center}.sp{justify-content:space-between}
.av{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px}
.chip{border:1px solid #e8e4da;background:rgba(255,255,255,.72);border-radius:99px;padding:8px 15px;white-space:nowrap;font-size:14px;font-weight:700}
.chip.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.tag{display:inline-block;background:rgba(255,255,255,.68);border-radius:999px;padding:4px 11px;font-size:12px;margin:4px 4px 0 0}
input,select,textarea{width:100%;background:rgba(255,255,255,.84);border:1px solid #e5dfd4;border-radius:14px;padding:12px 14px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}
.app-nav{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:8px;border:1px solid rgba(18,63,58,.08);border-radius:18px;background:rgba(255,255,255,.74);box-shadow:0 8px 28px rgba(18,63,58,.05)}
.app-nav button{flex:1;min-height:48px;border:0;border-radius:12px;padding:8px 14px;background:transparent;color:var(--muted);font-size:14px;font-weight:700}
.app-nav button b{margin-inline-end:8px;font-size:18px;font-weight:400}
.app-nav button.on{background:var(--mint);color:var(--ink)}
.sheet{position:fixed;inset:0;background:rgba(10,25,20,.56);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{width:min(720px,100%);max-height:90vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:28px;background:var(--sand);box-shadow:0 -16px 60px rgba(18,63,58,.16)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(480px,calc(100% - 32px));background:var(--ink);color:var(--white);padding:14px 18px;border-radius:14px;z-index:30;text-align:center;box-shadow:0 12px 30px rgba(18,63,58,.2)}
.auth-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:24px;align-items:stretch}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:520px;display:flex;flex-direction:column;justify-content:center;border-radius:32px;padding:clamp(36px,7vw,82px);background:var(--ink);color:var(--white);box-shadow:0 24px 70px rgba(18,63,58,.2)}
.hero::before{position:absolute;z-index:1;inset:0;background:linear-gradient(90deg,rgba(18,63,58,.94) 0%,rgba(18,63,58,.88) 58%,rgba(156,74,55,.72) 100%);content:"";pointer-events:none}
.hero::after{position:absolute;z-index:1;inset:auto -80px -180px auto;width:400px;height:400px;border:1px solid rgba(217,164,65,.4);border-radius:50%;box-shadow:0 0 0 35px rgba(217,164,65,.06),0 0 0 75px rgba(217,164,65,.04);content:"";pointer-events:none}
.hero>*{position:relative;z-index:2}
.logo{font-size:64px;font-weight:900;letter-spacing:-3px;line-height:1.1}.logo i{font-style:normal;color:var(--coral)}
.hero h2{max-width:600px;margin-top:18px;font-size:clamp(34px,5vw,58px);line-height:1.16}
.hero p{max-width:620px;margin:14px 0 0;color:#e5e9df;font-size:clamp(17px,2.4vw,20px)}
.eyebrow{display:inline-flex;align-self:flex-start;align-items:center;border:1px solid rgba(239,209,139,.42);border-radius:999px;padding:4px 12px;background:rgba(217,164,65,.15);color:#ffe3a2;font-size:14px;font-weight:800}
.auth-panel{align-self:center;transform:translateY(-24px);width:100%;max-width:480px;margin-inline:auto;border:1px solid rgba(18,63,58,.08);border-radius:28px;padding:clamp(24px,4vw,40px);background:rgba(255,255,255,.86);box-shadow:0 18px 48px rgba(18,63,58,.1)}
.auth-panel>.chips{margin-bottom:14px}
.auth-panel>input,.auth-panel>.filters{margin-bottom:10px}
.auth-panel>.btn{width:100%}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;margin:8px 0;background:rgba(255,255,255,.8);border:1px solid rgba(18,63,58,.08)}
.msg.me{margin-left:auto;background:var(--green);color:var(--white);border-color:var(--green)}
.st{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.65)}
.st.ok{color:var(--green)}.st.wait{color:#9a7018}.st.no{color:var(--coral)}
#list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px}
@media(max-width:900px){.auth-layout{grid-template-columns:1fr}.hero{min-height:380px}.auth-panel{max-width:none}#list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){#app{width:calc(100% - 28px)}.topbar{flex-wrap:wrap;gap:12px;margin-block:10px 16px;padding:10px}.brand{font-size:27px}.primary-nav{display:none}.language-switch{margin-inline-start:auto}.auth-layout{gap:16px}.hero{min-height:320px;border-radius:24px;padding:30px 24px}.hero h2{font-size:36px}.logo{font-size:52px}.auth-panel{transform:none;padding:22px;border-radius:22px}main{padding-top:4px;padding-bottom:84px}.app-nav{position:fixed;left:50%;bottom:8px;z-index:10;width:calc(100% - 28px);transform:translateX(-50%);gap:2px;margin:0;padding:5px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px)}.app-nav button{min-height:48px;padding:6px 2px;font-size:11px}.app-nav button b{display:block;margin:0;font-size:18px}#list{grid-template-columns:1fr}.card{padding:20px}.sheet>div{padding:22px 18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>

};
const SUBJECTS={"Maths":["رياضيات","Math"],"Physique":["فيزياء","Physics"],"SVT":["علوم الحياة والأرض","Life sciences"],"Français":["فرنسية","French"],"Arabe":["عربية","Arabic"],"Anglais":["إنجليزية","English"],"Informatique":["إعلامية","Computer science"],"Éco-gestion":["اقتصاد وتصرّف","Economics"],"Philo":["فلسفة","Philosophy"],"Primaire":["ابتدائي","Primary"],"Collège":["إعدادي","Middle school"],"Lycée":["ثانوي","High school"],"Bac":["باكالوريا","Baccalaureate"],"Tunis":["تونس","Tunis"],"Ariana":["أريانة","Ariana"],"Sfax":["صفاقس","Sfax"],"Sousse":["سوسة","Sousse"],"Bizerte":["بنزرت","Bizerte"],"Nabeul":["نابل","Nabeul"],"Étudiant":["طالب","Student"],"Faculté":["كلية","University"]};
let LANGUAGE=(()=>{try{const l=localStorage.getItem("maak-language");return ["fr","ar","en"].includes(l)?l:"fr"}catch(_){return "fr"}})();
let T=[];
let S={role:null,tab:"x",q:"",mat:"Tous",niv:"Tous",ville:"Toutes",sel:null,slot:null,mode:null,bk:[],chat:null,chats:{},toast:"",
reqs:[{id:1,n:"Amine K.",lvl:"Bac Math",m:"Maths",slot:"Jeu 17h",mode:"En ligne",st:"new"},{id:2,n:"Lina R.",lvl:"9e année",m:"Physique",slot:"Sam 10h",mode:"À domicile",st:"new"},{id:3,n:"Omar D.",lvl:"2e année secondaire",m:"Informatique",slot:"Mer 18h",mode:"En ligne",st:"ok"}],
me:{mat:["Maths","Physique"],p:15,b:"Étudiant motivé, je vous aide à progresser pas à pas.",on:true}};
const $=s=>document.querySelector(s);
const ini=n=>n.split(" ").map(x=>x[0]).join("");
const av=t=>`<div class="av" style="background:${COL[t.id%COL.length]}">${ini(t.n)}</div>`;
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast="";render()},2200)}
function filt0(){return T.filter(t=>(S.mat=="Tous"||t.m.includes(S.mat))&&(S.niv=="Tous"||t.l.includes(S.niv))&&(S.ville=="Toutes"||t.c==S.ville)&&(!S.q||(t.n+t.u+t.m.join()).toLowerCase().includes(S.q.toLowerCase())))}
function cards(){const L=filt();return L.length?L.map(t=>`<div class="card" data-a="open" data-id="${t.id}" style="cursor:pointer"><div class="row">${av(t)}<div style="flex:1"><div class="row sp"><h3>${t.n}</h3><b>${t.p} DT/h</b></div><div class="sm mut">${t.u} · ${esc(t.c)}</div></div></div><div>${t.m.map(x=>`<span class="tag">${x}</span>`).join("")}</div><div class="sm mut" style="margin-top:6px">★ ${t.r} (${t.rv} avis) · ${t.md.map(esc).join(", ")}</div></div>`).join(""):`<div class="card mut">Aucun tuteur ne correspond. Essayez une autre matière ou une autre ville.</div>`}
function welcome(){const reg=S.am=="r";return `<main class="auth-layout"><section class="hero"><span class="eyebrow">Le soutien scolaire, plus proche de toi</span><div class="logo">maak<i>.</i></div><h2>Un étudiant à tes côtés pour réussir</h2><p>Trouve un tuteur près de chez toi ou en ligne, pour tous les niveaux jusqu’au Bac.</p></section><section class="auth-panel">
<div class="chips"><button class="chip ${reg?"":"on"}" data-a="am" data-v="i">Connexion</button><button class="chip ${reg?"on":""}" data-a="am" data-v="r">Inscription</button></div>
${reg?`<input id="nm" placeholder="Nom complet" autocomplete="name"><p></p><div class="filters" style="margin:0"><select id="rl"><option value="student">Élève</option><option value="tutor">Étudiant tuteur</option></select><select id="ct">${VIL.map(v=>`<option>${v}</option>`).join("")}</select></div><p></p>`:""}
<input id="em" type="email" placeholder="E-mail" autocomplete="email" value="${esc(S.em||"")}"><p></p><input id="pw" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="${reg?"new-password":"current-password"}">
${S.err?`<p class="sm" style="color:var(--no)">${esc(S.err)}</p>`:""}<p></p><button class="btn" data-a="auth">${reg?"Créer mon compte":"Me connecter"}</button>
<p class="sm mut" style="text-align:center;margin:18px 0 8px">Ou essayez la démo</p><div class="row"><button class="btn sm alt" style="flex:1" data-a="role" data-r="e">Démo élève</button><button class="btn sm alt" style="flex:1" data-a="role" data-r="t">Démo tuteur</button></div></section></main>`}
function rsheet(){return `<div class="sheet" data-a="rclose"><div><h2 style="font-size:20px">Votre avis</h2><div class="chips" style="font-size:26px">${[1,2,3,4,5].map(i=>`<button class="chip ${S.rv.n>=i?"on":""}" data-a="star" data-v="${i}">★</button>`).join("")}</div><textarea id="cm" rows="3" placeholder="Comment s’est passée la séance ?">${esc(S.rv.c)}</textarea><p></p><button class="btn" data-a="sendrev">Envoyer mon avis</button></div></div>`}
function nav(tabs){return `<nav class="app-nav">${tabs.map(([k,i,l])=>`<button class="${S.tab==k?"on":""}" data-a="tab" data-k="${k}"><b>${i}</b>${l}</button>`).join("")}</nav>`}
function eleve(){let v="";
if(S.tab=="x")v=`<h2>Trouver un tuteur</h2><input id="q" placeholder="Nom, matière, faculté…" value="${esc(S.q)}" style="margin-top:12px">
<div class="chips">${["Tous",...MAT].map(m=>`<button class="chip ${S.mat==m?"on":""}" data-a="mat" data-v="${m}">${m}</button>`).join("")}</div>
<div class="filters"><select data-a="niv">${["Tous",...NIV].map(x=>`<option ${S.niv==x?"selected":""}>${x}</option>`).join("")}</select><select data-a="ville">${["Toutes",...VIL].map(x=>`<option ${S.ville==x?"selected":""}>${x}</option>`).join("")}</select><select data-a="sort" style="grid-column:1/3"><option value="">Trier : pertinence</option><option value="p" ${S.sort=="p"?"selected":""}>Prix croissant</option><option value="r" ${S.sort=="r"?"selected":""}>Mieux notés</option></select></div><div id="list">${cards()}</div>`;
else if(S.tab=="s")v=`<h2>Mes séances</h2><div style="height:12px"></div>`+(S.bk.length?S.bk.map(b=>{const t=T.find(x=>x.id==b.t);return `<div class="card"><div class="row sp"><h3>${t.n}</h3><span class="st ${b.st=="Confirmée"||b.st=="Terminée"?"ok":b.st=="Annulée"?"no":"wait"}">${b.st}</span></div><div class="sm mut">${esc(b.slot)} · ${esc(b.mode)} · ${t.p} DT</div>${b.st!="Annulée"?`<div class="row" style="margin-top:10px"><button class="btn sm alt" data-a="chat" data-id="${t.id}">Écrire</button>${b.st=="Terminée"?(b.rated?`<span class="sm mut">Avis envoyé</span>`:`<button class="btn sm" data-a="rate" data-id="${b.id}">Laisser un avis</button>`):`<button class="btn sm no" data-a="cancel" data-id="${b.id}">Annuler</button>`}</div>`:""}</div>`}).join(""):`<div class="card mut">Aucune séance pour l’instant. Choisissez un tuteur dans « Explorer » pour réserver votre première séance.</div>`);
else if(S.tab=="m"){if(S.chat){const t=T.find(x=>x.id==S.chat),c=S.chats[t.id]||[];v=`<div class="row" style="margin-bottom:8px"><button class="chip" data-a="back">‹ Retour</button>${av(t)}<h3>${t.n}</h3></div><div>${c.length?c.map(m=>`<div class="msg ${m.me?"me":""}">${m.t}</div>`).join(""):`<p class="mut sm">Présentez-vous et indiquez le chapitre à travailler.</p>`}</div><div class="row" style="margin-top:12px"><input id="mi" placeholder="Votre message"><button class="btn sm" data-a="send">Envoyer</button></div>`}
else{const ids=Object.keys(S.chats);v=`<h2>Messages</h2><div style="height:12px"></div>`+(ids.length?ids.map(i=>{const t=T.find(x=>x.id==i),c=S.chats[i];return `<div class="card row" data-a="chat" data-id="${i}" style="cursor:pointer">${av(t)}<div><h3>${t.n}</h3><div class="sm mut">${c[c.length-1].t}</div></div></div>`}).join(""):`<div class="card mut">Pas encore de conversation. Ouvrez le profil d’un tuteur pour lui écrire.</div>`)}}
else v=`<h2>Mon profil</h2><div class="card" style="margin-top:12px"><h3>${S.user?S.user.name:"Élève"}${S.user&&S.user.city?" · "+esc(S.user.city):""}</h3><p class="mut sm">Séances réservées : ${S.bk.filter(b=>b.st!="Annulée").length}</p></div><button class="btn alt" data-a="out">Changer de rôle</button><p></p><button class="btn alt" data-a="theme">Basculer clair / sombre</button>`;
const hide=S.tab=="m"&&S.chat;return nav([["x","🔎","Explorer"],["s","📅","Séances"],["m","💬","Messages"],["p","👤","Profil"]])+`<main>${v}</main>`}
function tuteur(){let v="";const gain=S.reqs.filter(r=>r.st=="ok").length*S.me.p;
if(S.tab=="x"||S.tab=="d")v=`<h2>Demandes</h2><div class="card row sp" style="margin-top:12px"><div><div class="sm mut">Gains prévus</div><h1>${gain} DT</h1></div><span class="st ${S.me.on?"ok":"no"}">${S.me.on?"Disponible":"En pause"}</span></div>`+S.reqs.map(r=>`<div class="card"><div class="row sp"><h3>${r.n}</h3>${r.st=="new"?`<span class="st wait">Nouvelle</span>`:`<span class="st ${r.st=="ok"?"ok":"no"}">${r.st=="ok"?(r.done?"Terminée":"Acceptée"):"Refusée"}</span>`}</div><div class="sm mut">${r.lvl} · ${r.m}<br>${esc(r.slot)} · ${esc(r.mode)}</div>${r.st=="new"?`<div class="row" style="margin-top:10px"><button class="btn sm" data-a="acc" data-id="${r.id}">Accepter</button><button class="btn sm no" data-a="dec" data-id="${r.id}">Refuser</button></div>`:r.st=="ok"&&!r.done?`<div class="row" style="margin-top:10px"><button class="btn sm alt" data-a="done" data-id="${r.id}">Marquer terminée</button></div>`:""}</div>`).join("");
else v=`<h2>Mon profil tuteur</h2><div class="card" style="margin-top:12px"><h3>Matières enseignées</h3><div class="chips" style="flex-wrap:wrap">${MAT.map(m=>`<button class="chip ${S.me.mat.includes(m)?"on":""}" data-a="mm" data-v="${m}">${m}</button>`).join("")}</div><h3 style="margin:8px 0">Tarif : <span id="pv">${S.me.p}</span> DT/h</h3><input type="range" id="pr" min="8" max="40" value="${S.me.p}"><h3 style="margin:14px 0 6px">Présentation</h3><textarea id="bio" rows="3">${esc(S.me.b)}</textarea></div>
<button class="btn" data-a="save">Enregistrer mon profil</button><p></p><button class="btn alt" data-a="pause">${S.me.on?"Mettre en pause mes disponibilités":"Reprendre mes disponibilités"}</button><p></p><button class="btn alt" data-a="out">Changer de rôle</button>`;
return nav([["x","📥","Demandes"],["p","👤","Profil"]])+`<main>${v}</main>`}
function sheet(){const t=T.find(x=>x.id==S.sel);return `<div class="sheet" data-a="close"><div><div class="row">${av(t)}<div style="flex:1"><h2 style="font-size:20px">${t.n}</h2><div class="sm mut">${t.u} · ${esc(t.c)}</div></div><b>${t.p} DT/h</b></div>
<p>${t.b}</p><div>${t.m.map(x=>`<span class="tag">${x}</span>`).join("")}${t.l.map(x=>`<span class="tag">${x}</span>`).join("")}</div><p class="sm mut">★ ${Number(t.r).toFixed(1)} · ${t.rv} avis</p>${(S.revs||[]).slice(0,3).map(v=>`<div class="card sm">★ ${v.rating} · ${v.student}<br>${v.comment||""}</div>`).join("")}
<h3>Choisir un créneau</h3><div class="chips">${t.s.map(x=>`<button class="chip ${S.slot==x?"on":""}" data-a="slot" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>
<h3>Lieu</h3><div class="chips">${t.md.map(x=>`<button class="chip ${S.mode==x?"on":""}" data-a="mode" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>
<button class="btn" data-a="book" ${S.slot&&S.mode?"":"disabled style='opacity:.5'"}>Réserver la séance</button><p></p><button class="btn alt" data-a="chat" data-id="${t.id}">Écrire à ${t.n.split(" ")[0]}</button></div></div>`}
function translateUi(){if(!document.createTreeWalker)return;document.documentElement.lang=LANGUAGE=="ar"?"ar-TN":LANGUAGE;document.documentElement.dir=LANGUAGE=="ar"?"rtl":"ltr";const walker=document.createTreeWalker($("#app"),NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){const value=node.nodeValue.trim();const translated=TEXT[value]||SUBJECTS[value];if(translated){const leading=node.nodeValue.match(/^\s*/)[0],trailing=node.nodeValue.match(/\s*$/)[0];node.nodeValue=leading+translated[LANGUAGE=="ar"?0:1]+trailing}}document.querySelectorAll("#app input[placeholder],#app textarea[placeholder]").forEach(el=>{const tr=TEXT[el.placeholder];if(tr)el.placeholder=tr[LANGUAGE=="ar"?0:1]})}
function render(){$("#app").innerHTML=`<header class="topbar"><a class="brand" href="/" aria-label="MAAK">maak<span>.</span></a><nav class="primary-nav"><a class="nav-link" href="/">Accueil</a><a class="nav-link" href="/#about">À propos</a></nav><div class="language-switch" role="group" aria-label="Choisir la langue"><button type="button" value="fr" data-a="language" aria-pressed="${LANGUAGE=="fr"}">Français</button><button type="button" value="ar" data-a="language" aria-pressed="${LANGUAGE=="ar"}">العربية (تونسي)</button><button type="button" value="en" data-a="language" aria-pressed="${LANGUAGE=="en"}">English</button></div></header>`+(!S.role?welcome():S.role=="e"?eleve():tuteur())+(S.sel?sheet():"")+(S.rv?rsheet():"")+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:"");translateUi()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.tagName=="SELECT")return;const a=el.dataset.a,d=el.dataset;
if(a=="language"){LANGUAGE=el.value;try{localStorage.setItem("maak-language",LANGUAGE)}catch(_){}render();return}
if(a=="close"){if(e.target!==el)return;S.sel=null;S.slot=S.mode=null}
else if(a=="role"){login(d.r);return}
else if(a=="tab"){S.tab=d.k;S.chat=null}
else if(a=="mat")S.mat=d.v;
else if(a=="open"){S.sel=+d.id;S.slot=S.mode=null;S.revs=[];api("/tutors/"+d.id+"/reviews").then(r=>{S.revs=(r||[]).map(v=>({...v,student:esc(v.student),comment:esc(v.comment)}));render()})}
else if(a=="slot")S.slot=d.v;
else if(a=="mode")S.mode=d.v;
else if(a=="book"){if(!S.slot||!S.mode)return;const id=Date.now();api("/bookings","POST",{tutor_id:S.sel,slot:S.slot,mode:S.mode}).then(r=>{const b=r&&S.bk.find(x=>x.id==id);if(b)b.id=r.id});S.bk.unshift({id,t:S.sel,slot:S.slot,mode:S.mode,st:"En attente"});S.sel=null;S.slot=S.mode=null;S.tab="s";toast("Demande envoyée au tuteur");return}
else if(a=="cancel"){S.bk.find(b=>b.id==d.id).st="Annulée";api("/bookings/"+d.id,"PATCH",{status:"cancelled"});toast("Séance annulée");return}
else if(a=="chat"){S.chat=+d.id;S.sel=null;S.tab="m"}
else if(a=="back")S.chat=null;
else if(a=="send"){const i=$("#mi");if(!i.value.trim())return;api("/messages","POST",{to:S.chat,body:i.value.trim()});(S.chats[S.chat]=S.chats[S.chat]||[]).push({me:1,t:esc(i.value.trim())});const c=S.chat;render();return}
else if(a=="acc"||a=="dec"){S.reqs.find(r=>r.id==d.id).st=a=="acc"?"ok":"no";api("/bookings/"+d.id,"PATCH",{status:a=="acc"?"confirmed":"declined"})}
else if(a=="mm"){const m=S.me.mat,i=m.indexOf(d.v);i<0?m.push(d.v):m.splice(i,1)}
else if(a=="pause")S.me.on=!S.me.on;
else if(a=="out"){S.role=null;S.tab="x";TOKEN=null;S.bk=[];S.chats={};S.reqs=[];S.user=null}
else if(a=="am"){S.am=d.v;S.err=""}
else if(a=="auth"){doAuth();return}
else if(a=="save"){api("/tutor/profile","PUT",{hourly_rate:S.me.p,bio:S.me.b,is_available:S.me.on,subjects:S.me.mat}).then(r=>toast(r&&r.ok?"Profil enregistré":"Échec de l’enregistrement"));return}
else if(a=="done"){S.reqs.find(x=>x.id==d.id).done=true;api("/bookings/"+d.id,"PATCH",{status:"done"})}
else if(a=="rate")S.rv={id:+d.id,n:0,c:""};
else if(a=="star")S.rv.n=+d.v;
else if(a=="rclose"){if(e.target!==el)return;S.rv=null}
else if(a=="sendrev"){if(!S.rv.n){toast("Choisissez une note");return}const v=S.rv;api("/reviews","POST",{booking_id:v.id,rating:v.n,comment:v.c}).then(r=>{if(r&&r.ok){S.bk.find(b=>b.id==v.id).rated=true;toast("Merci pour votre avis")}else toast((r&&r.error)||"Erreur")});S.rv=null}
else if(a=="theme"){const r=document.documentElement;r.dataset.theme=r.dataset.theme=="dark"?"light":"dark"}
render()});
document.addEventListener("input",e=>{const t=e.target;
if(t.id=="q"){S.q=t.value;$("#list").innerHTML=cards();translateUi()}
else if(t.id=="pr"){S.me.p=+t.value;$("#pv").textContent=t.value}
else if(t.id=="bio")S.me.b=t.value;else if(t.id=="cm")S.rv.c=t.value});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.a=="language"){LANGUAGE=t.value;try{localStorage.setItem("maak-language",LANGUAGE)}catch(_){}render();return}if(["niv","ville","sort"].includes(t.dataset.a)){S[t.dataset.a]=t.value;render()}});
let TOKEN=null;
const API_BASE=location.hostname.endsWith(".web.app")?"https://maak-api.onrender.com/api":"/api";
async function api(p,m="GET",b){try{const r=await fetch(API_BASE+p,{method:m,headers:{"Content-Type":"application/json",...(TOKEN?{Authorization:"Bearer "+TOKEN}:{})},body:b?JSON.stringify(b):undefined});return await r.json()}catch(e){toast("Serveur indisponible");return null}}
const ST={pending:"En attente",confirmed:"Confirmée",cancelled:"Annulée",declined:"Annulée",done:"Terminée"};
function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function filt(){const L=filt0();return S.sort=="p"?L.sort((a,b)=>a.p-b.p):S.sort=="r"?L.sort((a,b)=>b.r-a.r):L}
async function doAuth(){const reg=S.am=="r",b={email:$("#em").value.trim(),password:$("#pw").value};S.em=b.email;
if(reg){b.name=$("#nm").value.trim();b.role=$("#rl").value;b.city=$("#ct").value}
const r=await api(reg?"/auth/register":"/auth/login","POST",b);
if(!r||!r.token){S.err=(r&&r.error)||"Connexion impossible";render();return}
S.err="";await boot(r)}
async function boot(r){TOKEN=r.token;S.user={...r.user,name:esc(r.user.name)};S.role=r.user.role=="student"?"e":"t";S.tab="x";
T=(await api("/tutors")||[]).map(t=>({...t,n:esc(t.n),u:esc(t.u),b:esc(t.b)}));const B=await api("/bookings")||[];
if(S.role=="e"){S.bk=B.map(b=>({id:b.id,t:b.tutor_id,slot:b.slot,mode:b.mode,st:ST[b.status],rated:!!b.rated}));const M=await api("/messages")||[];S.chats={};M.forEach(x=>{const k=x.sender_id==r.user.id?x.receiver_id:x.sender_id;(S.chats[k]=S.chats[k]||[]).push({me:x.sender_id==r.user.id,t:esc(x.body)})})}
else{S.reqs=B.map(b=>({id:b.id,n:esc(b.student_name),lvl:esc(b.student_level||""),m:b.subject||"",slot:b.slot,mode:b.mode,st:b.status=="pending"?"new":["confirmed","done"].includes(b.status)?"ok":"no",done:b.status=="done"}));const m=await api("/me");if(m&&m.profile)S.me={mat:m.profile.mat,p:m.profile.p,b:m.profile.b||"",on:!!m.profile.on}}
render()}
async function login(role){const r=await api("/auth/login","POST",{email:role=="e"?"eleve@maak.tn":"tuteur@maak.tn",password:"demo123"});if(r&&r.token)await boot(r)}
render();
</script>
</body>
</html>
